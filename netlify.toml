# NOTE: Production deployment is Cloudflare Pages, not Netlify.
# Cloudflare Pages does NOT read netlify.toml. Active redirect rules live in
# the _redirects file at the repo root, which Cloudflare Pages honors.
# This file is retained only in case the Netlify Functions endpoint
# (api/lease-application) is exercised in a separate Netlify preview build.

[build]
  functions = "netlify/functions"

# Canonical host: redirect www to apex (301)
[[redirects]]
  from = "https://www.axialrealty.com/*"
  to = "https://axialrealty.com/:splat"
  status = 301
  force = true

# Legacy .html URLs → extensionless canonical (301)
# Permanent redirects consolidate link equity to the canonical form.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/lease-application"
  to = "/.netlify/functions/lease-application"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Cache manifest and llms.txt briefly so updates propagate
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
